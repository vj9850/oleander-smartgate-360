<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parking Bays – SmartGate 360</title>
  <link rel="icon" href="../assets/icons/logo.webp" type="image/webp" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <script>(function(){ const s = sessionStorage.getItem('sg360_session'); if (!s) window.location.replace('../index.html'); })();</script>
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" id="mobile-menu-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div>
          <div class="topbar-title">SmartGate 360</div>
          <div class="topbar-breadcrumb">Masters / <span>Parking Bays</span></div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-date" id="topbar-date"></div>
        <div class="topbar-user">
          <div class="user-avatar" id="user-avatar">–</div>
          <div class="user-info">
            <div class="user-name" id="user-name">–</div>
            <div class="user-role" id="user-role">–</div>
          </div>
        </div>
      </div>
    </header>
    <div class="page-content" id="page-content"></div>
  </div>
</div>
<script src="../js/app.js"></script>
<script src="../js/masters.js"></script>
<script>
new MasterPage({
  key:          'sg_parkings',
  dataFile:     '../data/parkings.json',
  activeModule: 'parking',
  title:        'Parking Bay Management',
  subtitle:     'Configure vehicle parking bays, zones, GPS coordinates and capacity used by the Fleet Manager app',
  itemLabel:    'Parking Bay',
  idPrefix:     'P',
  idField:      'parkingId',
  pageSize:     15,

  stats: [
    { label: 'Total Bays',   color: 'green' },
    { label: 'Active',       color: 'teal',   filterKey: 'status', filterValue: 'Active' },
    { label: 'Main Zone',    color: 'blue',   filterKey: 'zone',   filterValue: 'Main' },
    { label: 'Event Zone',   color: 'orange', filterKey: 'zone',   filterValue: 'Events' }
  ],

  columns: [
    { key: 'parkingId', label: 'Bay ID',   type: 'id' },
    { key: 'name',      label: 'Bay Name', type: 'bold' },
    { key: 'zone',      label: 'Zone',     type: 'badge' },
    { key: 'capacity',  label: 'Capacity', type: 'number' },
    { key: 'lat',       label: 'Latitude', type: 'muted' },
    { key: 'lng',       label: 'Longitude',type: 'muted' }
  ],

  searchKeys: ['name', 'parkingId', 'zone', 'notes'],

  filters: [
    { field: 'zone',   label: 'Zone',   options: ['Main', 'East', 'West', 'North', 'South', 'Staff', 'Service', 'Events'] },
    { field: 'status', label: 'Status', options: ['Active', 'Inactive'] }
  ],

  fields: [
    { name: 'name',     label: 'Bay Name',        type: 'text',   required: true,  placeholder: 'e.g. Bay A – Main Entrance' },
    { name: 'zone',     label: 'Zone',            type: 'select', required: true,  options: ['Main', 'East', 'West', 'North', 'South', 'Staff', 'Service', 'Events'] },
    { name: 'capacity', label: 'Vehicle Capacity', type: 'number', required: true,  placeholder: 'e.g. 4' },
    { name: 'lat',      label: 'GPS Latitude',     type: 'text',   required: true,  placeholder: 'e.g. 18.9148367',  hint: 'Used for parking verification in driver app (10m radius check)' },
    { name: 'lng',      label: 'GPS Longitude',    type: 'text',   required: true,  placeholder: 'e.g. 73.2966273',  hint: 'Copy coordinates from Google Maps' },
    { name: 'notes',    label: 'Notes',           type: 'textarea',required: false, full: true, placeholder: 'Optional description or access instructions' }
  ]
}).init();
</script>
</body>
</html>
